name: Windows validation

on:
  push:
    branches:
      - feat/windows-client
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build and run Windows regression suite
        shell: pwsh
        run: pwsh -NoProfile -File '开发空间/Windows/scripts/test.ps1' -Configuration Release

      - name: Check installer contract
        shell: pwsh
        run: pwsh -NoProfile -File '开发空间/Windows/scripts/test-installer-contract.ps1'

      - name: Run isolated installer integration
        shell: pwsh
        run: pwsh -NoProfile -File '开发空间/Windows/scripts/test-installer.ps1' -NsisPath 'C:\Program Files (x86)\NSIS\makensis.exe'

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3037"/>
      <stop offset="1" stop-color="#14181D"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="46%" r="62%">
      <stop offset="0" stop-color="#F2B36A" stop-opacity=".14"/>
      <stop offset="1" stop-color="#F2B36A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="248" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="48" y="48" width="928" height="928" rx="248" fill="url(#glow)"/>

  <!-- Quiet text lines -->
  <rect x="210" y="330" width="470" height="34" rx="17" fill="#A6AFBB" opacity=".58"/>
  <rect x="210" y="430" width="570" height="46" rx="23" fill="#F08A63"/>
  <rect x="210" y="555" width="430" height="34" rx="17" fill="#A6AFBB" opacity=".48"/>
  <rect x="210" y="650" width="300" height="34" rx="17" fill="#A6AFBB" opacity=".30"/>

  <!-- Current reading position -->
  <circle cx="790" cy="453" r="62" fill="#F4BD70" opacity=".14"/>
  <circle cx="790" cy="453" r="31" fill="#F7D88D"/>
  <circle cx="779" cy="442" r="8" fill="#FFF8D7" opacity=".95"/>
</svg>
